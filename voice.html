<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microfone - Orçamentos por Evento</title>
<style>body{font:16px system-ui,Arial;background:#f3f6fa;color:#172635;margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}main{background:white;border:1px solid #dce4ec;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 28px #12243a12}h2{color:#12243a;margin-top:0}p{color:#667789;line-height:1.45}button{background:#245b86;color:white;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;cursor:pointer}button:disabled{opacity:.6}#status{min-height:42px;margin-top:16px;color:#245b86}#result{padding:10px;background:#f3f6fa;border-radius:8px;min-height:24px;overflow-wrap:anywhere}</style></head>
<body><main><h2>Ditado por voz</h2><p>Toque no botão e fale. Ao terminar, o texto será enviado ao campo do orçamento.</p><button id="start">🎙️ Iniciar microfone</button><div id="status">Pronto para iniciar.</div><div id="result" aria-live="polite"></div></main>
<script>
(function(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const btn=document.getElementById('start'),status=document.getElementById('status'),result=document.getElementById('result');
 function send(type,extra){try{if(window.opener&&!window.opener.closed)window.opener.postMessage(Object.assign({type:type},extra||{}),'*');}catch(e){}}
 function error(message){status.textContent=message;btn.disabled=false;send('ORCAMENTO_VOICE_ERROR',{message:message});}
 if(!SR){btn.disabled=true;error('Este navegador não oferece reconhecimento de voz. Use Chrome ou Edge atualizado.');}
 btn.addEventListener('click',function(){
  if(!SR)return;btn.disabled=true;status.textContent='Ouvindo… fale agora.';result.textContent='';
  const rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.maxAlternatives=1;let finalText='';
  rec.onresult=function(e){let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t;}result.textContent=(finalText+' '+interim).trim();};
  rec.onerror=function(e){let m=e.error==='not-allowed'||e.error==='service-not-allowed'?'Permissão do microfone negada. Autorize o microfone nas configurações do navegador.':'Falha no reconhecimento ('+e.error+'). Tente novamente.';error(m);};
  rec.onend=function(){if(finalText.trim()){status.textContent='Texto reconhecido. Retornando ao aplicativo…';send('ORCAMENTO_VOICE_RESULT',{transcript:finalText.trim()});setTimeout(function(){window.close();},500);}else{btn.disabled=false;status.textContent='Nenhuma fala reconhecida. Toque para tentar novamente.';}};
  try{rec.start();}catch(e){error('Não foi possível iniciar o microfone. Feche e abra esta janela novamente.');}
 });
})();
</script></body></html>
